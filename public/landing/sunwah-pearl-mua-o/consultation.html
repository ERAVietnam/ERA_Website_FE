<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/landing/sunwah-pearl/">
  <title>Sunwah Pearl – Trải nghiệm thực tế cùng ERA</title>
  <style>
    @font-face {
      font-family: "Fz Poppins";
      src: url("assets/fonts/fz-poppins-regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Fz Poppins";
      src: url("assets/fonts/fz-poppins-bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #f5efde; }
    .consultation {
      color: #500347;
      background: linear-gradient(180deg, rgba(245,239,222,.98), rgba(245,239,222,.72) 100%), url("assets/sunwah-pearl-consultation.webp") center / cover no-repeat;
      font-family: "Fz Poppins", sans-serif;
      font-synthesis: none;
    }
    .consultation-layout { max-width: 1440px; margin: 0 auto; container-type: inline-size; }
    .consultation-inner { width: 79.6%; margin: 0 auto; padding: 6cqw 0 7.2cqw; text-align: center; }
    .consultation-heading { margin: 0; font: 700 4cqw/1.18 "Fz Poppins", sans-serif; }
    .consultation-script { display: block; margin-bottom: 2.5cqw; font: 400 5.5cqw/1.25 "NVN Motherland Signature", cursive; }
    @font-face { font-family: "NVN Motherland Signature"; src: url("assets/fonts/nvn-motherland-signature.woff2") format("woff2"); font-display: swap; }
    .consultation-heading-line { display: block; }
    .consultation-copy { margin: 6cqw -1.5cqw 0; font-size: 2.3cqw; line-height: 1.4; }
    .consultation-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.4cqw; width: 70%; margin: 3cqw auto 0; }
    .consultation-action { display: flex; align-items: center; justify-content: center; min-height: 7.4cqw; padding: 1cqw .8cqw; border: 2px solid #c183b8; border-radius: 999px; color: inherit; background: rgba(255,255,255,.8); box-shadow: 0 4px 5px rgba(60,22,55,.22); font-size: 1.7cqw; font-weight: 700; line-height: 1.12; text-decoration: none; }
    .consultation-action:hover { background: #fff; }
    .consultation-action:focus-visible { outline: 3px solid #500347; outline-offset: 3px; }
    @media (max-width: 640px) {
      .consultation-inner { width: 90%; padding: 52px 0 40px; }
      .consultation-heading { font-size: 5.1vw; }
      .consultation-script { margin-bottom: 12px; font-size: 7vw; }
      .consultation-copy { margin: 28px 0 0; font-size: 14px; }
      .consultation-copy br { display: none; }
      .consultation-actions { grid-template-columns: minmax(0, 1fr); width: 100%; gap: 12px; margin-top: 24px; }
      .consultation-action { min-height: 64px; padding: 14px; font-size: 15px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="consultation" aria-labelledby="consultation-heading">
      <div class="consultation-layout">
        <div class="consultation-inner">
          <h2 class="consultation-heading" id="consultation-heading"><span class="consultation-script">Trải nghiệm thực tế</span><span class="consultation-heading-line">CÙNG ĐỘI NGŨ ERA VIETNAM</span></h2>
          <p class="consultation-copy">ERA đồng hành cùng Anh/Chị chọn đúng căn hộ<br>phù hợp nhất với phong cách sống và nhu cầu của từng thành viên.</p>
          <div class="consultation-actions">
            <a class="consultation-action" href="/du-an-sunwah-pearl-mua-o/" target="_parent"><span>Nhận Danh Sách Căn Hộ<br>Gia Đình Phù Hợp</span></a>
            <a class="consultation-action" href="/du-an-sunwah-pearl-mua-o/" target="_parent"><span>Đăng Ký Private Viewing<br>(Xem Nhà Thực Tế)</span></a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script>
    document.querySelectorAll('.consultation-action').forEach(function (link) {
      link.addEventListener('click', function (event) {
        if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
        var target = window.parent.document.getElementById('dang-ky-tu-van');
        if (!target) return;
        event.preventDefault();
        target.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      });
    });
  </script>
</body>
</html>
